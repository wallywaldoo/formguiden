table:
  name: automation_tokens
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - nhost_pat_id
        - label
        - expires_at
        - revoked_at
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - nhost_pat_id
        - label
        - expires_at
        - revoked_at
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
update_permissions:
  - role: user
    permission:
      columns:
        - revoked_at
        - label
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
