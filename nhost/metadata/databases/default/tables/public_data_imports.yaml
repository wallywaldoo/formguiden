table:
  name: data_imports
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - provider
        - status
        - error_summary
        - file_count
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - id
        - provider
        - status
        - confirmed_at
        - committed_at
        - error_summary
        - file_count
        - previewed_count
        - committed_count
        - failed_count
        - duplicate_count
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
update_permissions:
  - role: user
    permission:
      columns:
        - status
        - confirmed_at
        - committed_at
        - error_summary
        - file_count
        - previewed_count
        - committed_count
        - failed_count
        - duplicate_count
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
