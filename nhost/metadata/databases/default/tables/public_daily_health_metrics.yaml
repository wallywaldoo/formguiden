table:
  name: daily_health_metrics
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - local_date
        - source
        - import_id
        - external_id
        - sleep_duration_s
        - sleep_start_at
        - sleep_end_at
        - sleep_light_s
        - sleep_deep_s
        - sleep_rem_s
        - sleep_awake_s
        - hrv_rmssd_ms
        - resting_heart_rate_bpm
        - stress_avg
        - body_battery_high
        - body_battery_low
        - steps
        - respiration_avg_brpm
        - systolic_mmhg
        - diastolic_mmhg
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - id
        - local_date
        - source
        - import_id
        - external_id
        - sleep_duration_s
        - sleep_start_at
        - sleep_end_at
        - sleep_light_s
        - sleep_deep_s
        - sleep_rem_s
        - sleep_awake_s
        - hrv_rmssd_ms
        - resting_heart_rate_bpm
        - stress_avg
        - body_battery_high
        - body_battery_low
        - steps
        - respiration_avg_brpm
        - systolic_mmhg
        - diastolic_mmhg
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
