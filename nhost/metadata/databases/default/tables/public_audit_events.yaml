table:
  name: audit_events
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
        actor_user_id: x-hasura-user-id
      columns:
        - action
        - entity_type
        - entity_id
        - metadata
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - actor_user_id
        - action
        - entity_type
        - entity_id
        - metadata
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
