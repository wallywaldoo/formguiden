table:
  name: recommendation_signals
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - recommendation_id
        - signal_key
        - observed_value
        - unit
        - comparator
        - reference_value
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - id
        - recommendation_id
        - signal_key
        - observed_value
        - unit
        - comparator
        - reference_value
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
