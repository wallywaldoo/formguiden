table:
  name: body_measurements
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - measured_at
        - source
        - import_id
        - external_id
        - mass_kg
        - body_fat_pct
        - waist_m
        - systolic_mmhg
        - diastolic_mmhg
        - notes
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - id
        - measured_at
        - source
        - import_id
        - external_id
        - mass_kg
        - body_fat_pct
        - waist_m
        - systolic_mmhg
        - diastolic_mmhg
        - notes
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
