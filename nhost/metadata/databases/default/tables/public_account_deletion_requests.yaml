table:
  name: account_deletion_requests
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - status
        - requested_at
        - purge_after
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - id
        - status
        - requested_at
        - purge_after
        - cancelled_at
        - purged_at
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
update_permissions:
  - role: user
    permission:
      columns:
        - status
        - cancelled_at
        - purged_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
