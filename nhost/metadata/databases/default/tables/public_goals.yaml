table:
  name: goals
  schema: public
array_relationships:
  - name: goal_snapshots
    using:
      foreign_key_constraint_on:
        column: goal_id
        table:
          schema: public
          name: goal_snapshots
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - status
        - race_type
        - race_distance_m
        - race_date
        - target_duration_s
        - target_pace_s_per_km
        - target_mass_kg
        - weekly_run_distance_m
        - weekly_run_duration_s
        - weekly_strength_sessions
        - weekly_strength_duration_s
        - notes
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - status
        - race_type
        - race_distance_m
        - race_date
        - target_duration_s
        - target_pace_s_per_km
        - target_mass_kg
        - weekly_run_distance_m
        - weekly_run_duration_s
        - weekly_strength_sessions
        - weekly_strength_duration_s
        - notes
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
update_permissions:
  - role: user
    permission:
      columns:
        - status
        - race_type
        - race_distance_m
        - race_date
        - target_duration_s
        - target_pace_s_per_km
        - target_mass_kg
        - weekly_run_distance_m
        - weekly_run_duration_s
        - weekly_strength_sessions
        - weekly_strength_duration_s
        - notes
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
