table:
  name: ai_estimation_requests
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - provider
        - model
        - status
        - prompt_description
        - locale
        - response_energy_kcal
        - response_protein_g
        - response_carbohydrate_g
        - response_fat_g
        - response_fiber_g
        - assumptions
        - confidence
        - range_energy_kcal_min
        - range_energy_kcal_max
        - error_code
        - duration_ms
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - id
        - provider
        - model
        - status
        - prompt_description
        - locale
        - response_energy_kcal
        - response_protein_g
        - response_carbohydrate_g
        - response_fat_g
        - response_fiber_g
        - assumptions
        - confidence
        - range_energy_kcal_min
        - range_energy_kcal_max
        - error_code
        - duration_ms
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
