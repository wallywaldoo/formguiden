table:
  name: body_measurement_previews
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - import_id
        - import_file_id
        - expires_at
        - source
        - external_id
        - measured_at
        - mass_kg
        - body_fat_pct
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - id
        - import_id
        - import_file_id
        - expires_at
        - source
        - external_id
        - measured_at
        - mass_kg
        - body_fat_pct
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
