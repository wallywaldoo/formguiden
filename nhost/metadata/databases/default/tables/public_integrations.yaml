table:
  name: integrations
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - provider
        - status
        - external_athlete_id
        - connected_at
        - metadata
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - provider
        - status
        - external_athlete_id
        - connected_at
        - metadata
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
update_permissions:
  - role: user
    permission:
      columns:
        - status
        - metadata
        - connected_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
