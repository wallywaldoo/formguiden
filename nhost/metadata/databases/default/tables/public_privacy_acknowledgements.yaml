table:
  name: privacy_acknowledgements
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - document_version
        - ip_hash
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - document_version
        - acknowledged_at
        - ip_hash
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
