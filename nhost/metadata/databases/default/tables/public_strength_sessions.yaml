table:
  name: strength_sessions
  schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user_id:
          _eq: X-Hasura-User-Id
      set:
        user_id: x-hasura-user-id
      columns:
        - started_at
        - duration_s
        - perceived_effort
        - notes
        - source
select_permissions:
  - role: user
    permission:
      columns:
        - user_id
        - id
        - started_at
        - duration_s
        - perceived_effort
        - notes
        - source
        - created_at
        - updated_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      allow_aggregations: false
update_permissions:
  - role: user
    permission:
      columns:
        - started_at
        - duration_s
        - perceived_effort
        - notes
        - source
      filter:
        user_id:
          _eq: X-Hasura-User-Id
      check:
        user_id:
          _eq: X-Hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter:
        user_id:
          _eq: X-Hasura-User-Id
